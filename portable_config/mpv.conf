# mpv English Learning configuration
# Place this portable_config directory next to mpv.exe.

# --- Window / video layout ---
# Reserve the right 40% of the window for the learning subtitle panel.
video-margin-ratio-right=0.40
video-align-x=-1
keepaspect=yes

# Start with a reasonably large window.
autofit=90%x90%

# --- Playback ---
hwdec=auto-safe
save-position-on-quit=yes
keep-open=yes

# --- External subtitles ---
# Load loosely matching subtitle filenames.
sub-auto=fuzzy
# Hide mpv's normal subtitle renderer. english-subs.lua renders the side panel.
sub-visibility=no

# --- uosc integration ---
# uosc provides the mouse-oriented controller.
osc=no
osd-bar=no
border=no

# --- General ---
alang=ja,jpn,en,eng
slang=en,eng,ja,jpn
