# mpv English Learning key / mouse bindings

# Mouse
MBTN_LEFT cycle pause
MBTN_LEFT_DBL cycle fullscreen
MBTN_RIGHT script-binding uosc/menu

# Wheel over plain video area: seek 5 seconds.
# uosc handles the wheel itself when the pointer is over its timeline/volume/speed widgets.
WHEEL_UP seek 5
WHEEL_DOWN seek -5

# Basic playback
SPACE cycle pause
LEFT seek -5
RIGHT seek 5
UP seek 10
DOWN seek -10
Shift+LEFT seek -1 exact
Shift+RIGHT seek 1 exact

# English-learning controls
# Previous / next subtitle cue
Ctrl+LEFT script-message english-subs-prev
Ctrl+RIGHT script-message english-subs-next

# Replay current subtitle from its beginning
r script-message english-subs-replay

# Toggle the right-side learning subtitle panel
s script-message english-subs-toggle

# Playback speed
[ add speed -0.1
] add speed 0.1
BS set speed 1.0
